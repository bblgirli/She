name: Apply app theme and reply fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          theme_css = r'''
/* Global She theme — shared by every page */
html[data-theme="dark"], html[data-theme="dark"] body { background:#101010 !important; color:#f3f3f3 !important; color-scheme:dark; }
html[data-theme="dark"] .phone-app, html[data-theme="dark"] .app-container, html[data-theme="dark"] .chat-app, html[data-theme="dark"] main, html[data-theme="dark"] section, html[data-theme="dark"] .settings-list, html[data-theme="dark"] .settings-profile { background:#151515 !important; color:#f3f3f3 !important; }
html[data-theme="dark"] header, html[data-theme="dark"] footer, html[data-theme="dark"] .simple-header, html[data-theme="dark"] .bottom-nav, html[data-theme="dark"] .message-footer { background:#181818 !important; color:#f3f3f3 !important; border-color:#333 !important; }
html[data-theme="dark"] .setting-item, html[data-theme="dark"] .settings-profile, html[data-theme="dark"] .contact-item, html[data-theme="dark"] .chat-item, html[data-theme="dark"] .call-item, html[data-theme="dark"] .status-item, html[data-theme="dark"] .card, html[data-theme="dark"] .list-item { background:#1c1c1c !important; color:#f3f3f3 !important; border-color:#333 !important; }
html[data-theme="dark"] input, html[data-theme="dark"] textarea, html[data-theme="dark"] select, html[data-theme="dark"] [contenteditable="true"] { background:#242424 !important; color:#fff !important; border-color:#444 !important; }
html[data-theme="dark"] p, html[data-theme="dark"] small, html[data-theme="dark"] .subtitle, html[data-theme="dark"] .settings-title { color:#bdbdbd !important; }
html[data-theme="dark"] .messages { background:#111 !important; }
html[data-theme="dark"] .message.received { background:#2b2b2b !important; color:#f5f5f5 !important; }
html[data-theme="dark"] .message.sent { color:#fff !important; }
html[data-theme="dark"] .msg-context { background:#252525 !important; color:#fff !important; }
html[data-theme="dark"] .msg-context button { color:#fff !important; }
html[data-theme="dark"] .modal, html[data-theme="dark"] .popup, html[data-theme="dark"] .menu, html[data-theme="dark"] .dialog { background:#242424 !important; color:#fff !important; }
html[data-theme="light"] { color-scheme:light; }
'''
          Path('global-theme.css').write_text(theme_css, encoding='utf-8')
          Path('global-theme.js').write_text(r'''(()=>{
const KEY='she_theme';
function apply(){document.documentElement.dataset.theme=localStorage.getItem(KEY)==='dark'?'dark':'light'}
window.sheSetTheme=t=>{localStorage.setItem(KEY,t==='dark'?'dark':'light');apply()};
window.sheToggleTheme=()=>sheSetTheme(localStorage.getItem(KEY)==='dark'?'light':'dark');
apply();
document.addEventListener('click',e=>{const item=e.target.closest('.setting-item');if(!item)return;const title=item.querySelector('h3')?.textContent?.trim().toLowerCase();if(title==='dark mode'){e.preventDefault();e.stopImmediatePropagation();sheToggleTheme()}},true);
})();''', encoding='utf-8')
          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            if 'global-theme.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="global-theme.css?v=1"><script src="global-theme.js?v=1"></script></head>',1)
              p.write_text(s,encoding='utf-8')
          p=Path('chat-bubbles.js');s=p.read_text(encoding='utf-8')
          if 'sheReplyBridgeInstalled' not in s:
            marker="document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;if(menu&&!menu.contains(e.target))closeMenu()});"
            bridge="window.sheReplyBridgeInstalled=true;window.addEventListener('sheReplyToMessage',e=>{const d=e.detail||{},i=document.getElementById('messageInput');if(!i||!d.id)return;i.dataset.replyTo=d.id;i.dataset.replyText=d.text||'';i.setAttribute('data-reply-to',d.id);i.setAttribute('data-reply-text',d.text||'');i.focus();});"
            s=s.replace(marker,bridge+marker);p.write_text(s,encoding='utf-8')
          p=Path('chat.html');s=p.read_text(encoding='utf-8')
          if 'reply-fix.js' not in s:
            s=s.replace('</body>','<script src="reply-fix.js?v=1"></script></body>',1);p.write_text(s,encoding='utf-8')
          Path('reply-fix.js').write_text(r'''(()=>{const input=()=>document.getElementById('messageInput');window.getSheReplyTarget=()=>{const i=input();if(!i)return null;const id=i.dataset.replyTo||i.getAttribute('data-reply-to');return id?{id,text:i.dataset.replyText||i.getAttribute('data-reply-text')||''}:null};window.addEventListener('sheReplyToMessage',e=>{const d=e.detail||{},i=input();if(!i||!d.id)return;i.dataset.replyTo=d.id;i.dataset.replyText=d.text||'';i.setAttribute('data-reply-to',d.id);i.setAttribute('data-reply-text',d.text||'')});})();''',encoding='utf-8')
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-theme.css global-theme.js reply-fix.js chat-bubbles.js chat.html '*.html'
          git diff --cached --quiet || git commit -m "Fix global dark mode and message replies"
          git push
