name: She architecture refactor

on:
  push:
    branches: [stability-rearchitecture]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stability-rearchitecture
          fetch-depth: 0

      - name: Apply bootstrap cutover
        if: ${{ hashFiles('.refactor-she') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core
          git mv app.js core/legacy-app.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/legacy-app.js')
          s = p.read_text()
          s = s.replace('from "./firebase-config.js"', 'from "../firebase-config.js"', 1)
          s = s.replace('from "./firebase-runtime.js"', 'from "../firebase-runtime.js"', 1)
          p.write_text(s)
          PY
          cat > app.js <<'EOF'
          // She application bootstrap.
          import './core/legacy-app.js';
          import './feature-bootstrap.js';
          EOF
          rm .refactor-she
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js core/legacy-app.js .refactor-she
          git commit -m "Make app.js a stable application bootstrap"
          git push origin stability-rearchitecture
