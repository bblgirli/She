name: Normalize Firestore initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use the shared Firestore instance
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          s = s.replace('const { getFirestore, initializeFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");', 'const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");', 1)
          old = '''db = initializeFirestore(firebaseApp, {
              experimentalForceLongPolling: true,
              useFetchStreams: false
          });'''
          s = s.replace(old, 'db = getFirestore(firebaseApp);', 1)
          p.write_text(s)
          PY
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet -- app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove conflicting Firestore initialization"
          git push
