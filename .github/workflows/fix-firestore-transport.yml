name: Fix Firestore transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Make Firestore initialization singleton-safe
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '''db = initializeFirestore(firebaseApp, {
              experimentalForceLongPolling: true,
              useFetchStreams: false
          });'''
          new = '''if (window.__sheFirestoreDb) {
              db = window.__sheFirestoreDb;
          } else {
              try {
                  db = initializeFirestore(firebaseApp, {
                      experimentalForceLongPolling: true,
                      useFetchStreams: false
                  });
              } catch (firestoreInitError) {
                  if (firestoreInitError?.code === "failed-precondition") {
                      db = getFirestore(firebaseApp);
                  } else {
                      throw firestoreInitError;
                  }
              }
              window.__sheFirestoreDb = db;
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'window.__sheFirestoreDb' in s:
              print('Firestore singleton patch already present.')
          else:
              raise SystemExit('Expected Firestore initialization block was not found; refusing to modify app.js')
          p.write_text(s)
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Make Firestore initialization singleton-safe"
          git push
