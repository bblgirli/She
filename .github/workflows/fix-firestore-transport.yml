name: Fix Firestore transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Firestore initialization safely
        shell: bash
        run: |
          set -e
          if grep -q 'initializeFirestore(firebaseApp, {' app.js; then
            echo "Firestore transport already patched."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old_import = 'const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");'
          new_import = 'const { getFirestore, initializeFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");'
          old_db = 'db = getFirestore(firebaseApp);'
          new_db = '''db = initializeFirestore(firebaseApp, {
              experimentalForceLongPolling: true,
              useFetchStreams: false
          });'''
          if old_import not in s or old_db not in s:
              raise SystemExit('Expected Firestore initialization was not found; refusing to modify app.js')
          s = s.replace(old_import, new_import, 1).replace(old_db, new_db, 1)
          p.write_text(s)
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Firestore WebChannel transport"
          git push
