name: Fix Firestore transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Firebase initialization race and cache
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          if 'let firebaseInitPromise = null;' not in s:
              s = s.replace('let firebaseInitialized = false;', 'let firebaseInitialized = false;\nlet firebaseInitPromise = null;', 1)
          start_old = 'async function initializeFirebase() {\n    if (firebaseInitialized) return;'
          start_new = 'function initializeFirebase() {\n    if (firebaseInitialized) return Promise.resolve(true);\n    if (firebaseInitPromise) return firebaseInitPromise;\n    firebaseInitPromise = (async () => {'
          if start_old in s:
              s = s.replace(start_old, start_new, 1)
          elif 'firebaseInitPromise = (async () =>' not in s:
              raise SystemExit('Firebase initialization start not found; refusing to modify app.js')
          end_old = '''        return true;\n    } catch (error) {\n        console.error("❌ Firebase error:", error);\n        showDebug("❌ Firebase error: " + error.message);\n        return false;\n    }\n}\n\n// ============================================\n// DEBUG & UI HELPERS'''
          end_new = '''        return true;\n    } catch (error) {\n        console.error("❌ Firebase error:", error);\n        showDebug("❌ Firebase error: " + error.message);\n        return false;\n    }\n    })();\n    return firebaseInitPromise;\n}\n\n// ============================================\n// DEBUG & UI HELPERS'''
          if end_old in s:
              s = s.replace(end_old, end_new, 1)
          elif 'return firebaseInitPromise;' not in s:
              raise SystemExit('Firebase initialization end not found; refusing to modify app.js')
          p.write_text(s)
          p = Path('chat.html')
          s = p.read_text()
          s = s.replace('src="app.js"', 'src="app.js?v=20260818b"', 1)
          p.write_text(s)
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- app.js chat.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js chat.html
          git commit -m "Fix Firebase initialization race and refresh chat bundle"
          git push
