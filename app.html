<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078b59"><link rel="icon" href="favicon.svg"><title>She Messenger</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}.app{height:100%;display:flex;flex-direction:column}.content{position:relative;flex:1;min-height:0}.page{width:100%;height:100%;border:0;display:block}.call-bar{display:none;position:absolute;left:10px;right:10px;bottom:10px;height:54px;z-index:50;border:0;border-radius:18px;background:#078b59;color:#fff;padding:0 14px;font-weight:700;align-items:center;gap:10px}.nav{height:64px;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #ddd;background:#fff;z-index:60}.nav button{border:0;background:none;font:inherit;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav small{font-size:11px}</style></head><body><div class="app"><main class="content"><iframe class="page" id="page" src="chats.html" title="M3ss3nger"></iframe><button class="call-bar" id="callBar" type="button">🟢 <span id="callLabel">Call</span><span id="callTime">00:00</span><span style="margin-left:auto">Return to call</span></button></main><nav class="nav"><button data-page="chats.html">💬<small>Chats</small></button><button data-page="calls.html">📞<small>Calls</small></button><button data-page="status.html">◉<small>Status</small></button><button data-page="contacts.html">👤<small>Contacts</small></button></nav></div><script>
(()=>{const frame=document.getElementById('page'),bar=document.getElementById('callBar');let callWindow=null;window.SHE_APP_SHELL=true;window.SHE_OPEN_PAGE=p=>{if(p)frame.src=p};document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>frame.src=b.dataset.page));window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='SHE_CALL_STARTED'){bar.style.display='flex';document.getElementById('callLabel').textContent=d.name||'Call';}if(d.type==='SHE_CALL_ENDED'){bar.style.display='none';}if(d.type==='SHE_OPEN_CALL'){if(d.url)frame.src=d.url;}});bar.onclick=()=>{if(callWindow&&!callWindow.closed){callWindow.focus();return}frame.src='chat.html?call=active'};})();
</script></body></html>
