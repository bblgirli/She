<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#078b59">
<title>She Messenger</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#fff}.app{height:100%;display:flex;flex-direction:column}.content{position:relative;flex:1;min-height:0}.page{width:100%;height:100%;border:0;display:block;background:#fff}.call-bar{display:none;position:absolute;left:10px;right:10px;bottom:10px;height:54px;z-index:50;border:0;border-radius:18px;background:#078b59;color:#fff;padding:0 14px;font-weight:700;align-items:center;gap:10px}.nav{height:64px;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #ddd;background:#fff;z-index:60}.nav button{border:0;background:none;font:inherit;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav small{font-size:11px}.call-layer{position:fixed;inset:0;z-index:100;display:none;background:#fff}.call-layer iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="app">
  <main class="content" id="content"><iframe class="page" id="page" src="chats.html" title="M3ss3nger"></iframe><button class="call-bar" id="callBar" type="button">🟢 <span id="callLabel">Call</span><span id="callTime">00:00</span><span style="margin-left:auto">Open</span></button></main>
  <nav class="nav"><button data-page="chats.html">💬<small>Chats</small></button><button data-page="calls.html">📞<small>Calls</small></button><button data-page="status.html">◉<small>Status</small></button><button data-page="contacts.html">👤<small>Contacts</small></button></nav>
</div>
<script src="voice-call-screen.js"></script>
<script src="call-navigation-shell.js"></script>
<script>
(()=>{const f=document.getElementById('page'),bar=document.getElementById('callBar'),label=document.getElementById('callLabel'),time=document.getElementById('callTime');let active=false;document.querySelectorAll('.nav [data-page]').forEach(b=>b.onclick=()=>{f.src=b.dataset.page});bar.onclick=()=>window.parent.openVoiceCallScreen?.({name:window.__sheCallName||'Contact',status:window.__sheCallStatus||'Connected'});window.addEventListener('she:call-active',e=>{active=true;label.textContent=e.detail?.name||'Call';bar.style.display='flex'});window.addEventListener('she:call-status',e=>{if(e.detail?.time)time.textContent=e.detail.time});window.addEventListener('she:end-voice-call',()=>{active=false;bar.style.display='none'});window.openVoiceCallScreen=window.openVoiceCallScreen||function(){window.location.href='chat.html'};})();
</script>
</body>
</html>
