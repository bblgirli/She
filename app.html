<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#078b59"><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="responsive-fixes.css"><link rel="stylesheet" href="voice-call-screen.css">
<title>She Messenger</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#appShell{height:100dvh;width:100%;position:relative;overflow:hidden}.view{position:absolute;inset:0;display:none;background:#fff;overflow:hidden}.view.active{display:flex;flex-direction:column}.chat-list{flex:1;min-height:0;overflow:auto}.chat-app{height:100%;width:100%;display:flex!important;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto}.message-footer{flex-shrink:0}.bottom-nav{display:none!important}#appNav{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid #ddd;z-index:9998}#appNav button{border:0;background:transparent;font:inherit;min-width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}#appNav small{font-size:11px}#miniCallBar{position:fixed;left:10px;right:10px;bottom:74px;height:52px;display:none;align-items:center;gap:9px;border:0;border-radius:17px;background:#078b59;color:#fff;z-index:9999;padding:0 14px;font-weight:700;box-shadow:0 5px 22px #0003}.show{display:flex!important}.grow{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="appShell">
<section id="chatsView" class="view active"><header class="app-header"><h1>Chats</h1><div class="header-actions"><button onclick="searchChats?.()">🔍</button><button onclick="openMenu()">⋮</button></div></header><div class="chat-tabs"><button class="active">All</button><button>Unread</button><button>Favorites</button><button>Groups</button></div><main class="chat-list" id="chatList"><div class="message received"><p>Loading chats…</p></div></main><button class="new-chat-button" onclick="newChat()">💬</button></section>
<section id="chatView" class="view"><div class="chat-app"><header class="chat-header"><button class="back-button icon-btn" type="button" onclick="showView('chats')">‹</button><div class="chat-profile"><div class="small-avatar">👤</div><div><h3 id="appChatName">Chat</h3><p id="appChatStatus">online</p></div></div><div class="chat-actions"><button class="icon-btn" onclick="startVideoCall()">📹</button><button id="voiceCallButton" class="icon-btn" type="button">📞</button><button class="icon-btn">⋮</button></div></header><main class="messages" id="messages"><div id="typingIndicator" class="typing-indicator" style="display:none">typing...</div></main><footer class="message-footer"><div class="message-input-container"><button class="icon-btn" onclick="showEmoji()">😊</button><input id="messageInput" type="text" placeholder="Type a message" autocomplete="off" oninput="updateMessageActions()" onkeydown="handleEnter(event)"><button id="sendMessageButton" class="icon-btn message-action-hidden" onclick="sendMessage()">➤</button><button id="attachButton" class="icon-btn" onclick="attachFile()">📎</button><button id="cameraButton" class="icon-btn" onclick="openCamera()">📷</button></div><div id="voiceRecordingUI" class="voice-recording-ui" style="display:none"></div><button id="micButton" class="mic-button icon-btn">🎙️</button></footer></div><audio id="remoteAudio" autoplay playsinline></audio></section>
<section id="callsView" class="view"><div style="padding:24px"><h1>Calls</h1><div id="callsList"></div><p id="emptyCallsMessage">No calls yet.</p></div></section><section id="statusView" class="view"><div style="padding:24px"><h1>Status</h1><p>Status updates will appear here.</p></div></section><section id="contactsView" class="view"><div style="padding:24px"><h1>Contacts</h1><div id="contactsList"></div></div></section>
<button id="miniCallBar" type="button"><span>🟢</span><span id="miniCallName" class="grow">Call</span><span id="miniCallTime">00:00</span><span>Open</span></button><nav id="appNav"><button onclick="showView('chats')">💬<small>Chats</small></button><button onclick="showView('calls')">📞<small>Calls</small></button><button onclick="showView('status')">◉<small>Status</small></button><button onclick="showView('contacts')">👤<small>Contacts</small></button></nav></div>
<script>history.replaceState({appShell:true},'', 'chats.html');</script>
<script type="module" src="app.js"></script>
<script>
// Call audio processing only: request browser-level echo cancellation, noise suppression and auto gain control.
(()=>{const md=navigator.mediaDevices;if(!md?.getUserMedia)return;const original=md.getUserMedia.bind(md);md.getUserMedia=(constraints={})=>{if(constraints.audio){constraints={...constraints,audio:typeof constraints.audio==='object'?{...constraints.audio,echoCancellation:{ideal:true},noiseSuppression:{ideal:true},autoGainControl:{ideal:true},channelCount:{ideal:1}}:{echoCancellation:{ideal:true},noiseSuppression:{ideal:true},autoGainControl:{ideal:true},channelCount:{ideal:1}}};}return original(constraints)};})();
</script>
<script src="push-notifications.js?v=7"></script><script src="voice-note.js?v=3"></script><script src="chat-bubbles.js?v=4"></script><script src="camera-image-fix.js?v=2"></script><script src="chat-media.js?v=2"></script><script src="cloudinary-image-renderer.js?v=2"></script><script src="voice-call-screen.js?v=3"></script><script src="voice-call-webrtc.js?v=2"></script><script src="live-call-v2.js?v=2"></script><script src="live-call-caller-v2.js?v=1"></script>
<script>
window.showView=function(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(name+'View')?.classList.add('active');if(name==='chats')window.loadChats?.();if(name==='calls')window.loadCallHistory?.();if(name==='contacts')window.loadContactsPage?.()};
window.openChatView=function(uid,name){if(uid)localStorage.setItem('currentChatUid',uid);if(name)localStorage.setItem('currentChatName',name);document.getElementById('appChatName').textContent=name||localStorage.getItem('currentChatName')||'Chat';showView('chat');window.loadMessages?.()};window.openChat=window.openChatView;window.startChatWithUser=window.openChatView;window.newChat=function(){window.location.href='new-chat.html'};window.goBack=function(){showView('chats')};
document.getElementById('voiceCallButton').onclick=()=>window.startLiveCallV2?.();window.startVideoCall=()=>window.openVoiceCallScreen?.({name:document.getElementById('appChatName').textContent||'Contact',status:'Video calls coming soon'});
window.sheShowMiniCall=function(){const bar=document.getElementById('miniCallBar');if(!bar)return;const s=document.getElementById('voiceCallScreen');const n=s?.querySelector('.voice-call-name')?.textContent;const t=s?.querySelector('.voice-call-timer')?.textContent;if(n)document.getElementById('miniCallName').textContent=n;if(t)document.getElementById('miniCallTime').textContent=t;bar.classList.add('show')};
document.getElementById('miniCallBar').onclick=()=>{const s=document.getElementById('voiceCallScreen');if(s){s.classList.add('is-open');document.getElementById('miniCallBar').classList.remove('show')}};
window.addEventListener('she:call-active',e=>{document.getElementById('miniCallName').textContent=e.detail?.name||'Call';document.getElementById('miniCallBar').classList.add('show')});window.addEventListener('she:call-status',e=>{if(e.detail?.time)document.getElementById('miniCallTime').textContent=e.detail.time});window.addEventListener('she:end-voice-call',()=>document.getElementById('miniCallBar').classList.remove('show'));
function updateMessageActions(){const i=document.getElementById('messageInput'),s=document.getElementById('sendMessageButton'),a=document.getElementById('attachButton'),c=document.getElementById('cameraButton'),m=document.getElementById('micButton');if(!i)return;const h=!!i.value.trim();s?.classList.toggle('message-action-hidden',!h);a?.classList.toggle('message-action-hidden',h);c?.classList.toggle('message-action-hidden',h);m?.classList.toggle('message-action-hidden',h)}
</script>
</body></html>
