<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078b59"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="responsive-fixes.css"><link rel="stylesheet" href="voice-call-screen.css"><title>She Messenger</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#appRoot{width:100%;height:100%;position:relative}#view{width:100%;height:100%;overflow:auto}#persistentCallBar{display:none;position:fixed;left:12px;right:12px;bottom:76px;height:52px;z-index:9999;border:0;border-radius:16px;background:#078b59;color:#fff;font-weight:700;padding:0 16px;box-shadow:0 5px 22px #0003;align-items:center;gap:9px}#persistentCallBar.show{display:flex}#persistentCallBar .grow{flex:1;text-align:left}</style></head><body><div id="appRoot"><main id="view"></main><button id="persistentCallBar" type="button"><span>🟢</span><span id="persistentCallName" class="grow">Call</span><span id="persistentCallTime">00:00</span><span>Open</span></button></div><script type="module" src="app.js"></script><script src="push-notifications.js?v=1"></script><script src="voice-note.js?v=3"></script><script src="chat-bubbles.js?v=4"></script><script src="camera-image-fix.js?v=2"></script><script src="chat-media.js?v=2"></script><script src="cloudinary-image-renderer.js?v=2"></script><script src="voice-call-screen.js?v=3"></script><script src="voice-call-webrtc.js?v=2"></script><script src="live-call-v2.js?v=2"></script><script src="live-call-caller-v2.js?v=1"></script><script>(function(){const view=document.getElementById('view'),bar=document.getElementById('persistentCallBar'),nameEl=document.getElementById('persistentCallName'),timeEl=document.getElementById('persistentCallTime');async function loadView(url,push){if(!url||!url.endsWith('.html'))return;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,link[rel="stylesheet"]').forEach(x=>x.remove());view.innerHTML=doc.body?.innerHTML||'';if(push)history.pushState({view:url},'',url);window.dispatchEvent(new CustomEvent('she:view-loaded',{detail:{url}}));}catch(e){console.error('SPA view load failed',e)}}window.navigateApp=loadView;window.openAppView=loadView;document.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(a&&a.href&&a.origin===location.origin&&a.pathname.endsWith('.html')){e.preventDefault();loadView(a.getAttribute('href'),true)}},true);window.addEventListener('popstate',e=>loadView(e.state?.view||'chats.html',false));[['💬','Chats','chats.html'],['📞','Calls','calls.html'],['◉','Status','status.html'],['👤','Contacts','contacts.html']].forEach(([i,l,u])=>{const b=document.createElement('button');b.type='button';b.innerHTML=i+'<small style="display:block">'+l+'</small>';b.style.cssText='position:relative;z-index:9998;border:0;background:#fff;padding:8px 14px;font:inherit';b.onclick=()=>loadView(u,true);document.body.appendChild(b)});window.addEventListener('she:call-active',e=>{bar.classList.add('show');nameEl.textContent=e.detail?.name||'Voice call'});window.addEventListener('she:call-status',e=>{if(e.detail?.time)timeEl.textContent=e.detail.time});window.addEventListener('she:end-voice-call',()=>bar.classList.remove('show'));bar.onclick=()=>window.openVoiceCallScreen?.({name:nameEl.textContent,status:'Connected'});loadView('chats.html',false)})();</script></body></html>
