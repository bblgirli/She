<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone-app">

    <header class="app-header">
        <h1>Contacts</h1>

        <div class="header-actions">
            <button onclick="searchContacts()">🔍</button>
            <button onclick="openMenu()">⋮</button>
        </div>
    </header>

    <div class="search-bar">
        <input
            type="search"
            id="contactsSearch"
            placeholder="Search contacts"
            oninput="searchContactsInput(event)"
        >
    </div>

    <main class="contacts-list">

        <div class="contact-action" onclick="newChat()">
            <div class="action-icon">💬</div>

            <div>
                <h3>New Chat</h3>
                <p>Start a conversation</p>
            </div>
        </div>


        <div class="contact-action" onclick="createGroup()">
            <div class="action-icon">👥</div>

            <div>
                <h3>New Group</h3>
                <p>Create a group conversation</p>
            </div>
        </div>


        <h4 class="section-title">
            Contacts
        </h4>

        <div id="contactsResults">
            <div class="message received">
                <p>Add someone by phone number to build your real contact list.</p>
            </div>
        </div>

    </main>


    <nav class="bottom-nav">

        <button class="nav-item" onclick="goTo('chats.html')">
            <span>💬</span>
            <small>Chats</small>
        </button>

        <button class="nav-item" onclick="goTo('calls.html')">
            <span>📞</span>
            <small>Calls</small>
        </button>

        <button class="nav-item" onclick="goTo('status.html')">
            <span>◉</span>
            <small>Status</small>
        </button>

        <button class="nav-item active">
            <span>👤</span>
            <small>Contacts</small>
        </button>

    </nav>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
