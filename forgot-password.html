<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="logo-circle">💬</div>
        <h1>Forgot Password</h1>
        <p class="auth-subtitle">Enter your email to receive a password reset link.</p>
        <form id="forgotPasswordForm">
            <div class="input-box">
                <span>✉️</span>
                <input type="email" id="forgotEmail" placeholder="Email address" required>
            </div>
            <button type="submit" class="main-button">Send reset link</button>
        </form>
        <p id="forgotStatus" class="login-text" style="margin-top:0.75rem;"></p>
        <p class="login-text">Remembered your password? <a href="login.html">Log in</a></p>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
