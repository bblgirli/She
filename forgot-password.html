<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="global-theme.css?v=1"><script src="global-theme.js?v=1"></script></head>
<body class="auth-body">
    <main class="auth-container">
        <div class="logo-circle">💬</div>
        <h1>Forgot Password</h1>
        <p class="auth-subtitle">Enter your email to receive a password reset link.</p>
        
        <p id="firebaseStatus" class="login-text" style="font-size:0.95rem; margin-bottom: 0.75rem;">⏳ Firebase connecting...</p>

        <div id="firebaseError" class="status-message status-error" style="display: none; font-size: 0.9rem; margin-bottom: 0.75rem; padding: 8px; border-radius: 4px; background: #fee; color: #c33; border-left: 3px solid #c33;"></div>

        <div id="firebaseDebug" style="display: block; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 6px; border-radius: 3px; background: #f5f5f5; color: #333; border: 1px solid #ddd; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.3;"></div>

        <form id="forgotPasswordForm">
            <div class="input-box">
                <span>✉️</span>
                <input type="email" id="forgotEmail" placeholder="Email address" required>
            </div>
            <button type="submit" class="main-button">Send reset link</button>
            <p id="forgotStatus" class="login-text status-message" style="margin-top:0.75rem;"></p>
        </form>
        <p class="login-text">Remembered your password? <a href="login.html">Log in</a></p>
    </main>
    <script type="module" src="app.js?v=20260814-1"></script>
</body>
</html>
