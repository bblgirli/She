<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Me And You">
    <title>Log In</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #installAppPrompt{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
        #installAppPrompt .install-card{width:min(360px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
        #installAppPrompt h2{margin:0 0 8px;font-size:22px}
        #installAppPrompt p{margin:0 0 18px;color:#666;line-height:1.45}
        #installAppPrompt button{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:#078b59;color:#fff}
        #installAppPrompt .install-close{margin-top:10px;background:transparent;color:#666}
    </style>
</head>

<body class="auth-body">

    <div id="installAppPrompt" aria-hidden="true">
        <div class="install-card">
            <h2>Install Me And You</h2>
            <p>Install the app on your phone for a faster experience and notifications.</p>
            <button id="installAppButton" type="button">Install App</button>
            <button id="installAppClose" class="install-close" type="button">Not now</button>
        </div>
    </div>

    <main class="auth-container">

        <div class="logo-circle">
            💬
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Sign in to your account<br>
            to continue messaging.
        </p>

        <form id="loginForm">
            <div class="input-box">
                <span>✉️</span>
                <input type="email" id="loginEmail" placeholder="Email address" required>
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="button" class="password-toggle" onclick="toggleLoginPassword()">👁</button>
            </div>

            <div class="forgot-password">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="main-button">Log In</button>
        </form>

        <p id="loginStatus" class="login-text status-message" style="margin-bottom: 0.75rem;"></p>

        <div class="or-divider"><span>OR</span></div>

        <p id="firebaseStatus" class="login-text" style="font-size:0.95rem; margin-bottom: 0.75rem;"></p>
        <div id="firebaseError" class="status-message status-error" style="display: none; font-size: 0.9rem; margin-bottom: 0.75rem; padding: 8px; border-radius: 4px; background: #fee; color: #c33; border-left: 3px solid #c33;"></div>
        <div id="firebaseDebug" style="display: block; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 6px; border-radius: 3px; background: #f5f5f5; color: #333; border: 1px solid #ddd; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.3;"></div>

        <button class="google-button" onclick="googleLogin()">
            <span>G</span>
            Sign up or sign in with Google
        </button>

        <p class="login-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p class="terms">
            By continuing, you agree to our<br>
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>
        </p>
    </main>

    <script>
        // Safe fallback for older cached app.js builds. The current app.js
        // provides the real presence function; this only prevents login from
        // failing if an older deployed build is missing it.
        if (typeof window.setCurrentUserPresence !== "function") {
            window.setCurrentUserPresence = async function () {};
        }

        // Chrome/Edge exposes beforeinstallprompt for the native install dialog.
        // The browser requires a user gesture before showing its native prompt,
        // so we show our small install card immediately and open the native dialog
        // when the user taps Install App. Already-installed apps are not prompted.
        (function setupInstallPrompt(){
            let deferredPrompt = null;
            const prompt = document.getElementById('installAppPrompt');
            const install = document.getElementById('installAppButton');
            const close = document.getElementById('installAppClose');
            if (!prompt || !install || !close) return;

            const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (standalone) return;

            window.addEventListener('beforeinstallprompt', function(event){
                event.preventDefault();
                deferredPrompt = event;
                prompt.style.display = 'flex';
                prompt.setAttribute('aria-hidden','false');
            });

            install.addEventListener('click', async function(){
                if (!deferredPrompt) {
                    prompt.style.display = 'none';
                    return;
                }
                deferredPrompt.prompt();
                try { await deferredPrompt.userChoice; } catch(e) {}
                deferredPrompt = null;
                prompt.style.display = 'none';
                prompt.setAttribute('aria-hidden','true');
            });

            close.addEventListener('click', function(){
                prompt.style.display = 'none';
                prompt.setAttribute('aria-hidden','true');
            });

            window.addEventListener('appinstalled', function(){
                prompt.style.display = 'none';
                prompt.setAttribute('aria-hidden','true');
                deferredPrompt = null;
            });
        })();

        // Register the PWA service worker so Chrome can install Me And You as a standalone app.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function(){
                navigator.serviceWorker.register('/sw.js').catch(function(error){
                    console.error('PWA service worker registration failed:', error);
                });
            });
        }
    </script>

    <script type="module" src="app.js"></script>

</body>

</html>
