<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <main class="auth-container">

        <div class="logo-circle">
            💬
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Log in to continue messaging<br>
            your friends and family.
        </p>


        <form id="loginForm">

            <div class="input-box">

                <span>✉️</span>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >

            </div>


            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleLoginPassword()"
                >
                    👁
                </button>

            </div>


            <div class="forgot-password">

                <a href="forgot-password.html">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="main-button"
            >
                Log In
            </button>

        </form>

        <p id="loginStatus" class="login-text status-message" style="margin-bottom: 0.75rem;"></p>

        <div class="or-divider">
            <span>OR</span>
        </div>

        <p id="firebaseStatus" class="login-text" style="font-size:0.95rem; margin-bottom: 0.75rem;">⏳ Firebase connecting...</p>

        <div id="firebaseError" class="status-message status-error" style="display: none; font-size: 0.9rem; margin-bottom: 0.75rem; padding: 8px; border-radius: 4px; background: #fee; color: #c33; border-left: 3px solid #c33;"></div>

        <div id="firebaseDebug" style="display: block; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 6px; border-radius: 3px; background: #f5f5f5; color: #333; border: 1px solid #ddd; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.3;"></div>

        <button
            class="google-button"
            onclick="googleLogin()"
        >
            <span>G</span>
            Sign up or sign in with Google
        </button>


        <p class="login-text">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>


        <p class="terms">

            By continuing, you agree to our<br>

            <a href="#">
                Terms of Service
            </a>

            and

            <a href="#">
                Privacy Policy
            </a>

        </p>

    </main>


    <script type="module" src="app.js?v=20260814-1"></script>

</body>

</html>
