<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="logo-circle">💬</div>
        <h1>Reset Password</h1>
        <p class="auth-subtitle">Enter a new password to finish resetting your account.</p>
        
        <p id="firebaseStatus" class="login-text" style="font-size:0.95rem; margin-bottom: 0.75rem;">⏳ Firebase connecting...</p>

        <div id="firebaseError" class="status-message status-error" style="display: none; font-size: 0.9rem; margin-bottom: 0.75rem; padding: 8px; border-radius: 4px; background: #fee; color: #c33; border-left: 3px solid #c33;"></div>

        <div id="firebaseDebug" style="display: block; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 6px; border-radius: 3px; background: #f5f5f5; color: #333; border: 1px solid #ddd; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.3;"></div>

        <form id="resetPasswordForm">
            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="newPassword" placeholder="New password" required>
            </div>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="main-button">Change password</button>
            <p id="resetStatus" class="login-text status-message" style="margin-top:0.75rem;"></p>
        </form>
        <p class="login-text">Back to <a href="login.html">Log in</a></p>
    </main>
    <script type="module" src="app.js?v=20260814-1"></script>
</body>
</html>
