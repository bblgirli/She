<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>New Chat</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="phone-app">

    <header class="simple-header">

        <button onclick="goBack()">←</button>

        <h2>New Chat</h2>

        <button onclick="searchContacts()">🔍</button>

    </header>

    <div class="search-bar">
        <input
            type="search"
            id="newChatSearch"
            placeholder="Search users on this app"
            oninput="searchContactsInput(event)"
        >
    </div>

    <main class="new-chat-list">


        <div
            class="new-chat-action"
            onclick="createGroup()"
        >

            <div class="new-chat-icon">
                👥
            </div>

            <div>

                <h3>
                    New Group
                </h3>

                <p>
                    Create a group
                </p>

            </div>

        </div>


        <div
            class="new-chat-action"
            onclick="createContact()"
        >

            <div class="new-chat-icon">
                👤
            </div>

            <div>

                <h3>
                    New Contact
                </h3>

                <p>
                    Add a new contact
                </p>

            </div>

        </div>


        <h4 class="section-title">
            Contacts on this app
        </h4>

        <div id="newChatResults">
            <div class="message received">
                <p>Your saved contacts will appear here once you add someone by phone number.</p>
            </div>
        </div>

    </main>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
