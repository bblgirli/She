<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>Group Info</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="phone-app">

    <header class="simple-header">

        <button onclick="goBack()">←</button>

        <h2 id="groupTitle">Group Info</h2>

        <button onclick="openMenu()">⋮</button>

    </header>


    <main class="group-info-page">

        <div class="group-info-photo">
            👥
        </div>

        <h2 id="groupName">Development Team</h2>

        <p class="group-description" id="groupMemberCount">
            5 participants
        </p>

        <div class="group-info-actions">

            <button onclick="startCall()">
                <span>📞</span>
                Call
            </button>

            <button onclick="startVideoCall()">
                <span>📹</span>
                Video
            </button>

            <button onclick="addParticipant()">
                <span>👤</span>
                Add
            </button>

        </div>

        <div class="info-section">

            <h4>
                Participants
            </h4>

            <div id="participantsList">

                <div class="participant">

                    <div class="avatar">
                        👤
                    </div>

                    <div>
                        <h3>
                            You
                        </h3>

                        <p>
                            Group admin
                        </p>
                    </div>

                </div>

            </div>

        </div>

        <div class="info-section danger-zone">

            <button onclick="leaveGroup()" class="danger-button">
                Leave Group
            </button>

        </div>

    </main>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
