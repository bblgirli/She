<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>Chat</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="chat-page">


<div class="chat-app">


    <!-- CHAT HEADER -->

    <header class="chat-header">

        <button
            class="back-button"
            onclick="goBack()"
        >
            ←
        </button>


        <div class="chat-profile">

            <div class="small-avatar">
                👩🏾
            </div>

            <div>

                <h3>
                    Chat
                </h3>

                <p>
                    online
                </p>

            </div>

        </div>


        <div class="chat-actions">

            <button onclick="startVideoCall()">
                📹
            </button>

            <button onclick="startCall()">
                📞
            </button>

            <button>
                ⋮
            </button>

        </div>

    </header>


    <!-- MESSAGES -->

    <main
        class="messages"
        id="messages"
    >
    </main>

    <div id="typingIndicator" class="typing-indicator" style="display:none;">
        typing...
    </div>


    <!-- MESSAGE INPUT -->

    <footer class="message-footer">

        <div class="message-input-container">

            <button onclick="showEmoji()">
                😊
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message"
                autocomplete="off"
                onkeydown="handleEnter(event)"
            >

            <button onclick="sendMessage()">
                ✈️
            </button>

            <button onclick="attachFile()">
                📎
            </button>

            <button onclick="openCamera()">
                📷
            </button>

        </div>

        <!-- Voice Recording UI -->
        <div id="voiceRecordingUI" class="voice-recording-ui" style="display: none;">
            <div class="recording-indicator">
                <span class="recording-dot"></span>
                <span id="recordingTime">0:00</span>
            </div>
            <div class="pitch-level">
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
            </div>
            <button 
                id="lockRecordingBtn" 
                class="lock-recording-btn" 
                onclick="toggleLockRecording()"
                title="Lock to record hands-free"
            >
                🔓
            </button>
        </div>

        <button
            id="micButton"
            class="mic-button"
            onmousedown="startVoiceRecording()"
            ontouchstart="startVoiceRecording()"
            onmouseup="stopVoiceRecording()"
            ontouchend="stopVoiceRecording()"
        >
            🎙️
        </button>

    </footer>
    <!-- Remote Audio -->
    <audio id="remoteAudio" autoplay playinline></audio>

    <!-- Permissions Request Dialog -->
    <div id="permissionsDialog" class="permissions-modal" style="display: none;">
        <div class="permissions-container">
            <h2>App Permissions</h2>
            <p>She needs these permissions to work properly:</p>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-notification" checked disabled>
                <label for="perm-notification">
                    <strong>Notifications</strong>
                    <span>Get message alerts and incoming call notifications</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-microphone" checked disabled>
                <label for="perm-microphone">
                    <strong>Microphone</strong>
                    <span>Record voice messages and make calls</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-camera" checked disabled>
                <label for="perm-camera">
                    <strong>Camera</strong>
                    <span>Take photos and set profile picture</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-media" checked disabled>
                <label for="perm-media">
                    <strong>Media & Files</strong>
                    <span>Upload photos and share media</span>
                </label>
            </div>
            
            <div class="permissions-actions">
                <button class="btn-allow" onclick="requestAllPermissions()">Allow All</button>
                <button class="btn-skip" onclick="skipPermissions()">Skip for Now</button>
            </div>
            
            <p class="permission-note">You can change these settings anytime in your browser settings.</p>
        </div>
    </div>

    <!-- Incoming Call Screen -->
    <div id="incomingCallScreen" class="call-screen incoming-call-screen" style="display: none;">
        <div class="call-screen-content">
            <div class="call-screen-avatar">📱</div>
            <h2>Incoming Call</h2>
            <p id="incomingCallerName">Unknown Caller</p>
            <div class="call-buttons">
                <button class="call-accept-btn" onclick="answerCall()">
                    ✓ Accept
                </button>
                <button class="call-decline-btn" onclick="declineCall()">
                    ✕ Decline
                </button>
            </div>
        </div>
    </div>

    <!-- Outgoing Call Screen -->
    <div id="outgoingCallScreen" class="call-screen outgoing-call-screen" style="display: none;">
        <div class="call-screen-content">
            <div class="call-screen-avatar">📱</div>
            <h2>Calling...</h2>
            <p id="outgoingCalleeName">Unknown</p>
            <div class="call-buttons">
                <button class="call-end-btn" onclick="endCall()">
                    ✕ Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Ongoing Call Screen -->
    <div id="ongoingCallScreen" class="call-screen ongoing-call-screen" style="display: none;">
        <div class="call-screen-content">
            <div class="call-screen-avatar">📱</div>
            <h2>Call Connected</h2>
            <p id="callDuration">0:00</p>
            <div class="call-buttons">
                <button class="call-end-btn" onclick="endCall()">
                    ✕ End Call
                </button>
            </div>
        </div>
    </div>
</div>


<script type="module" src="app.js"></script>

</body>
</html>
