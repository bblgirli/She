ton class="icon-btn" onclick="startVideoCall()" aria-label="Video call"><svg viewBox="0 0 24 24" fill="none"><path d="m15 10 4.2-2.4A1.2 1.2 0 0 1 21 8.6v6.8a1.2 1.2 0 0 1-1.8 1L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg></button><button class="icon-btn" onclick="startCall()" aria-label="Voice call"><svg viewBox="0 0 24 24" fill="none"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6.3 6.3l1.3-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9Z"/></svg></button><button class="icon-btn" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></header><main class="messages" id="messages"><div id="typingIndicator" class="typing-indicator" style="display:none;">typing...</div></main><footer class="message-footer"><div class="message-input-container"><button class="icon-btn" onclick="showEmoji()" aria-label="Emoji"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></button><input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" oninput="updateMessageActions()" onkeydown="handleEnter(event)"><button id="sendMessageButton" class="icon-btn message-action-hidden" onclick="sendMessage()" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button><button id="attachButton" class="icon-btn" onclick="attachFile()" aria-label="Attach image"><svg viewBox="0 0 24 24" fill="none"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><button id="cameraButton" class="icon-btn" onclick="openCamera()" aria-label="Camera"><svg viewBox="0
