<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#078b59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="She">
<title>Chat</title>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="responsive.css?v=5">
<link rel="stylesheet" href="responsive-fixes.css?v=8">
<style>
.icon-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.chat-actions .icon-btn,.back-button,.message-input-container .icon-btn,.mic-button{display:inline-flex;align-items:center;justify-content:center}
.message-input-container .icon-btn{border:0;background:transparent;padding:0;min-width:30px}
.mic-button svg{width:21px;height:21px}
</style>
</head>
<body class="chat-page">
<div class="chat-app">
<header class="chat-header">
<button class="back-button icon-btn" onclick="goBack()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
<div class="chat-profile"><div class="small-avatar">👩🏾</div><div><h3>Chat</h3><p>online</p></div></div>
<div class="chat-actions">
<button class="icon-btn" onclick="startVideoCall()" aria-label="Video call"><svg viewBox="0 0 24 24" fill="none"><path d="m15 10 4.2-2.4A1.2 1.2 0 0 1 21 8.6v6.8a1.2 1.2 0 0 1-1.8 1L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg></button>
<button class="icon-btn" onclick="startCall()" aria-label="Voice call"><svg viewBox="0 0 24 24" fill="none"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6.3 6.3l1.3-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9Z"/></svg></button>
<button class="icon-btn" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>
</header>
<main class="messages" id="messages">
<div id="typingIndicator" class="typing-indicator" style="display:none;">typing...</div>
</main>
<footer class="message-footer">
<div class="message-input-container">
<button class="icon-btn" onclick="showEmoji()" aria-label="Emoji"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></button>
<input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" onkeydown="handleEnter(event)">
<button class="icon-btn" onclick="sendMessage()" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
<button class="icon-btn" onclick="attachFile()" aria-label="Attach file"><svg viewBox="0 0 24 24" fill="none"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
<button class="icon-btn" onclick="openCamera()" aria-label="Camera"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
</div>
<div id="voiceRecordingUI" class="voice-recording-ui" style="display:none;">
<div class="recording-indicator"><span class="recording-dot"></span><span id="recordingTime">0:00</span></div>
<div class="pitch-level"><div class="pitch-bar"></div><div class="pitch-bar"></div><div class="pitch-bar"></div><div class="pitch-bar"></div><div class="pitch-bar"></div></div>
<button id="lockRecordingBtn" class="lock-recording-btn" onclick="toggleLockRecording()" title="Lock to record hands-free">🔓</button>
</div>
<button id="micButton" class="mic-button icon-btn" onmousedown="startVoiceRecording()" ontouchstart="startVoiceRecording()" onmouseup="stopVoiceRecording()" ontouchend="stopVoiceRecording()" aria-label="Record voice message"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
</footer>
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="permissionsDialog" class="permissions-modal" style="display:none;"><div class="permissions-container"><h2>App Permissions</h2><p>She needs these permissions to work properly:</p><div class="permission-item"><input type="checkbox" id="perm-notification" checked disabled><label for="perm-notification"><strong>Notifications</strong><span>Get message alerts and incoming call notifications</span></label></div><div class="permission-item"><input type="checkbox" id="perm-microphone" checked disabled><label for="perm-microphone"><strong>Microphone</strong><span>Record voice messages and make calls</span></label></div><div class="permission-item"><input type="checkbox" id="perm-camera" checked disabled><label for="perm-camera"><strong>Camera</strong><span>Take photos and set profile picture</span></label></div><div class="permission-item"><input type="checkbox" id="perm-media" checked disabled><label for="perm-media"><strong>Media & Files</strong><span>Upload photos and share media</span></label></div><div class="permissions-actions"><button class="btn-allow" onclick="requestAllPermissions()">Allow All</button><button class="btn-skip" onclick="skipPermissions()">Skip for Now</button></div><p class="permission-note">You can change these settings anytime in your browser settings.</p></div></div>
<div id="incomingCallScreen" class="call-screen incoming-call-screen" style="display:none;"><div class="call-screen-content"><div class="call-screen-avatar">📱</div><h2>Incoming Call</h2><p id="incomingCallerName">Unknown Caller</p><div class="call-buttons"><button class="call-accept-btn" onclick="answerCall()">✓ Accept</button><button class="call-decline-btn" onclick="declineCall()">✕ Decline</button></div></div></div>
<div id="outgoingCallScreen" class="call-screen outgoing-call-screen" style="display:none;"><div class="call-screen-content"><div class="call-screen-avatar">📱</div><h2>Calling...</h2><p id="outgoingCalleeName">Unknown</p><div class="call-buttons"><button class="call-end-btn" onclick="endCall()">✕ Cancel</button></div></div></div>
<div id="ongoingCallScreen" class="call-screen ongoing-call-screen" style="display:none;"><div class="call-screen-content"><div class="call-screen-avatar">📱</div><h2>Call Connected</h2><p id="callDuration">0:00</p><div class="call-buttons"><button class="call-end-btn" onclick="endCall()">✕ End Call</button></div></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
