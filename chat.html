<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>Chat</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="chat-page">


<div class="chat-app">


    <!-- CHAT HEADER -->

    <header class="chat-header">

        <button class="back-button" onclick="goBack()">
            ←
        </button>

        <div class="chat-profile">

            <div class="small-avatar">
                👤
            </div>

            <div>

                <h3 id="chatName">Chat</h3>

                <p id="chatStatus">online</p>

            </div>

        </div>


        <div class="chat-actions">

            <button onclick="startVideoCall()">
                📹
            </button>

            <button onclick="startCall()">
                ☎️
            </button>

            <button onclick="openMenu()">
                ⋮
            </button>

        </div>

    </header>


    <!-- MESSAGES -->

    <main class="messages" id="messages">
    </main>

    <div id="typingIndicator" class="typing-indicator" style="display:none;">
        typing...
    </div>


    <!-- MESSAGE INPUT FOOTER -->

    <footer class="message-footer">

        <div class="message-input-container">

            <!-- Upload file button -->
            <button class="message-action-btn" onclick="attachFile()" title="Send file">
                📎
            </button>

            <!-- Message input field -->
            <input
                type="text"
                id="messageInput"
                placeholder="Message"
                autocomplete="off"
                onkeydown="handleEnter(event)"
                oninput="handleMessageInput()"
            >

            <!-- Camera button (hidden when text exists) -->
            <button id="cameraBtn" class="message-action-btn" onclick="openCamera()" title="Take photo">
                📷
            </button>

            <!-- Voice message button (hidden when text exists) -->
            <button id="voiceBtn" class="message-action-btn mic-button" 
                onmousedown="startVoiceRecording()"
                ontouchstart="startVoiceRecording()"
                onmouseup="stopVoiceRecording()"
                ontouchend="stopVoiceRecording()"
                title="Voice message">
                🎙️
            </button>

            <!-- Send button (shown when text exists) -->
            <button id="sendBtn" class="message-send-btn" onclick="sendMessage()" style="display: none;" title="Send message">
                ✈️
            </button>

        </div>

        <!-- Voice Recording UI -->
        <div id="voiceRecordingUI" class="voice-recording-ui" style="display: none;">
            <div class="recording-indicator">
                <span class="recording-dot"></span>
                <span id="recordingTime">0:00</span>
            </div>
            <div class="pitch-level">
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
                <div class="pitch-bar"></div>
            </div>
            <button 
                id="lockRecordingBtn" 
                class="lock-recording-btn" 
                onclick="toggleLockRecording()"
                title="Lock to record hands-free"
            >
                🔓
            </button>
        </div>

    </footer>

    <!-- Remote Audio -->
    <audio id="remoteAudio" autoplay playinline></audio>

    <!-- Permissions Request Dialog -->
    <div id="permissionsDialog" class="permissions-modal" style="display: none;">
        <div class="permissions-container">
            <h2>App Permissions</h2>
            <p>She needs these permissions to work properly:</p>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-notification" checked disabled>
                <label for="perm-notification">
                    <strong>Notifications</strong>
                    <span>Get message alerts and incoming call notifications</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-microphone" checked disabled>
                <label for="perm-microphone">
                    <strong>Microphone</strong>
                    <span>Record voice messages and make calls</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-camera" checked disabled>
                <label for="perm-camera">
                    <strong>Camera</strong>
                    <span>Take photos and set profile picture</span>
                </label>
            </div>
            
            <div class="permission-item">
                <input type="checkbox" id="perm-media" checked disabled>
                <label for="perm-media">
                    <strong>Storage</strong>
                    <span>Send photos and files</span>
                </label>
            </div>

            <div class="permissions-buttons">
                <button onclick="requestAllPermissions()" class="permissions-allow">
                    Allow All
                </button>
                <button onclick="skipPermissions()" class="permissions-skip">
                    Skip for Now
                </button>
            </div>
        </div>
    </div>

    <!-- Incoming Call Screen -->
    <div id="incomingCallScreen" class="call-screen incoming-call" style="display: none;">
        <div class="call-overlay"></div>
        <div class="call-content">
            <div class="call-header">
                <div class="caller-info">
                    <div class="caller-avatar">👤</div>
                    <div class="caller-details">
                        <h2 id="incomingCallerName">Incoming Call</h2>
                        <p>Calling...</p>
                    </div>
                </div>
            </div>
            <div class="call-actions">
                <button onclick="answerCall()" class="call-accept">
                    ✓ Answer
                </button>
                <button onclick="declineCall()" class="call-decline">
                    ✕ Decline
                </button>
            </div>
        </div>
    </div>

    <!-- Outgoing Call Screen -->
    <div id="outgoingCallScreen" class="call-screen outgoing-call" style="display: none;">
        <div class="call-overlay"></div>
        <div class="call-content">
            <div class="call-header">
                <div class="caller-info">
                    <div class="caller-avatar">👤</div>
                    <div class="caller-details">
                        <h2 id="outgoingCalleeName">Calling...</h2>
                        <p>Waiting for answer...</p>
                    </div>
                </div>
            </div>
            <div class="call-actions">
                <button onclick="endCall()" class="call-end">
                    ✕ End Call
                </button>
            </div>
        </div>
    </div>

    <!-- Ongoing Call Screen -->
    <div id="ongoingCallScreen" class="call-screen ongoing-call" style="display: none;">
        <div class="call-overlay"></div>
        <div class="call-content">
            <div class="call-header">
                <div class="caller-info">
                    <div class="caller-avatar">👤</div>
                    <div class="caller-details">
                        <h2>In Call</h2>
                        <p id="callDuration">0:00</p>
                    </div>
                </div>
            </div>
            <div class="call-actions">
                <button onclick="endCall()" class="call-end">
                    ✕ End Call
                </button>
            </div>
        </div>
    </div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
