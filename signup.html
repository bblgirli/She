<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <main class="auth-container">

        <div class="logo-circle">
            💬
        </div>

        <h1>Create your account</h1>

        <p class="auth-subtitle">
            Sign up to start messaging your<br>
            friends and family.
        </p>

        <p id="firebaseStatus" class="login-text" style="font-size:0.95rem; margin-bottom: 0.75rem;">⏳ Firebase connecting...</p>

        <div id="firebaseError" class="status-message status-error" style="display: none; font-size: 0.9rem; margin-bottom: 0.75rem; padding: 8px; border-radius: 4px; background: #fee; color: #c33; border-left: 3px solid #c33;"></div>

        <div id="firebaseDebug" style="display: block; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 6px; border-radius: 3px; background: #f5f5f5; color: #333; border: 1px solid #ddd; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.3;"></div>

        <div class="profile-picture">
            <span>👤</span>

            <button class="camera-button">
                📷
            </button>
        </div>

        <form id="signupForm">

            <div class="input-box">
                <span>👤</span>
                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >
            </div>

            <div class="input-box">
                <span>📞</span>

                <select id="countryCode">
                    <option value="+234">+234</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                </select>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                >
            </div>

            <div class="input-box">
                <span>✉️</span>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >
            </div>

            <div class="input-box">
                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                >
                    👁
                </button>
            </div>

            <button type="submit" class="main-button">
                Sign Up
            </button>
            <p id="signupStatus" class="login-text status-message"></p>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

        <p class="terms">
            By signing up, you agree to our<br>
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>
        </p>

    </main>

    <script type="module" src="app.js?v=20260814-1"></script>

</body>
</html>
