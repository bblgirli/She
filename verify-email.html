<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="logo-circle">💬</div>
        <h1>Verify Your Email</h1>
        <p class="auth-subtitle">A verification link has been sent to your email. Click it and then reload this page.</p>
        <p id="verifyEmailAddress" class="login-text" style="margin-bottom:0.75rem; font-weight:600;"></p>
        <button id="checkVerification" class="main-button">I have verified my email</button>
        <p id="verifyStatus" class="login-text status-message" style="margin-top:0.75rem;"></p>
        <p class="login-text">Need a new link? <a href="#" id="resendVerifyLink">Resend verification email</a></p>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
