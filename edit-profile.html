<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>Edit Profile</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="phone-app">


    <header class="simple-header">

        <button onclick="goBack()">
            ←
        </button>

        <h2>
            Edit Profile
        </h2>

        <button onclick="saveProfile()">
            ✓
        </button>

    </header>


    <main class="edit-profile-page">


        <!-- PROFILE PHOTO -->

        <div class="edit-photo-container">

            <div
                class="edit-profile-photo"
                id="editProfilePhoto"
            >
                👤
            </div>

            <button
                class="edit-photo-button"
                onclick="changeProfilePhoto()"
            >
                📷
            </button>

        </div>


        <p class="change-photo-text">
            Change profile photo
        </p>


        <!-- NAME -->

        <div class="edit-input-group">

            <label>
                Name
            </label>

            <div class="edit-input">

                <span>👤</span>

                <input
                    type="text"
                    id="editName"
                    placeholder="Your name"
                    maxlength="50"
                >

            </div>

        </div>


        <!-- ABOUT -->

        <div class="edit-input-group">

            <label>
                About
            </label>

            <div class="edit-input">

                <span>💬</span>

                <input
                    type="text"
                    id="editAbout"
                    placeholder="About you"
                    maxlength="100"
                >

            </div>

        </div>

        <!-- PHOTO URL -->

        <div class="edit-input-group">

            <label>
                Profile Photo URL
            </label>

            <div class="edit-input">

                <span>🖼️</span>

                <input
                    type="url"
                    id="editPhotoURL"
                    placeholder="https://example.com/photo.jpg"
                >

            </div>

            <p class="input-note">
                Provide a public image URL for your profile photo.
            </p>

        </div>

        <!-- PHONE -->

        <div class="edit-input-group">

            <label>
                Phone Number
            </label>

            <div class="edit-input">

                <span>📞</span>

                <input
                    type="tel"
                    id="editPhone"
                    placeholder="+234 800 000 0000"
                >

            </div>

        </div>


        <button
            class="save-profile-button"
            onclick="saveProfile()"
        >
            Save Changes
        </button>


    </main>

</div>


<script type="module" src="app.js"></script>

<script>

    /*
     * Load saved profile information
     */

</script>

</body>

</html>
