<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Calls</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="voice-call-screen.css"><link rel="stylesheet" href="global-theme.css?v=1"><script src="global-theme.js?v=1"></script></head><body><div class="phone-app"><header class="app-header"><h1>Calls</h1></header><main class="calls-list"><div class="call-link-item"><div class="call-link-icon">🔗</div><div class="call-details"><h3>Create call link</h3><p>Share a link for your call</p></div></div><h4 class="section-title">Recent</h4><div class="call-item"><div class="avatar">👩🏾</div><div class="call-details"><h3>Oluwatosin</h3><p class="outgoing">↗ Outgoing • Today</p></div><button class="call-button" onclick="placeVoiceCall('Oluwatosin')">📞</button></div><div class="call-item"><div class="avatar">👨🏾</div><div class="call-details"><h3>Abdullahi</h3><p class="incoming">↙ Incoming • Today</p></div><button class="call-button" onclick="placeVoiceCall('Abdullahi')">📞</button></div></main><nav class="bottom-nav"><button class="nav-item" onclick="location.href='chats.html'"><span>💬</span><small>Chats</small></button><button class="nav-item active"><span>📞</span><small>Calls</small></button><button class="nav-item" onclick="location.href='status.html'"><span>◉</span><small>Status</small></button><button class="nav-item" onclick="location.href='contacts.html'"><span>👤</span><small>Contacts</small></button></nav></div><script type="module" src="app.js"></script><script src="voice-call-screen.js"></script><script src="voice-call-webrtc.js"></script><script>window.placeVoiceCall=async function(name){const uid=localStorage.getItem('currentChatUid');if(!uid){alert('Open this person\'s chat first, then start the call.');return}try{await window.startVoiceWebRTCCall(uid,name,'')}catch(e){console.error(e);alert(e.message||'Unable to start call')}};</script></body></html>
