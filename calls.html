<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>Calls</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="phone-app">


    <header class="app-header">

        <h1>Calls</h1>

        <div class="header-actions">

            <button onclick="searchContacts()">
                🔍
            </button>

            <button onclick="openMenu()">
                ⋮
            </button>

        </div>

    </header>


    <main class="calls-list">

        <div id="emptyCallsMessage" style="display: none;">
            <div class="message received">
                <p>📞 Your recent calls will appear here</p>
            </div>
        </div>

        <div id="callsList"></div>

    </main>


    <nav class="bottom-nav">

        <button class="nav-item" onclick="goTo('chats.html')">
            <span>💬</span>
            <small>Chats</small>
        </button>

        <button class="nav-item active">
            <span>📞</span>
            <small>Calls</small>
        </button>

        <button class="nav-item" onclick="goTo('status.html')">
            <span>◉</span>
            <small>Status</small>
        </button>

        <button class="nav-item" onclick="goTo('contacts.html')">
            <span>👤</span>
            <small>Contacts</small>
        </button>

    </nav>

</div>


<script type="module" src="app.js"></script>

</body>

</html>
