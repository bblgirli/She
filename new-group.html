<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">

    <title>New Group</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="phone-app">

    <header class="simple-header">

        <button onclick="goBack()">←</button>

        <h2>New Group</h2>

        <button onclick="createGroup()">✓</button>

    </header>

    <main class="new-chat-list">

        <div class="new-chat-action" onclick="createGroup()">

            <div class="new-chat-icon">
                👥
            </div>

            <div>

                <h3>
                    Create Group
                </h3>

                <p>
                    Start a group conversation
                </p>

            </div>

        </div>


        <h4 class="section-title">
            Suggested contacts
        </h4>

        <!-- Dynamically populated by loadGroupSuggestions() -->

    </main>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
