<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#078b59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="She">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone-app">

    <header class="simple-header">
        <button onclick="goBack()">←</button>
        <h2>Profile</h2>
        <button>⋮</button>
    </header>

    <main class="profile-page">

        <div class="profile-photo-container">
            <div class="large-profile-photo" id="profilePhoto">
                👤
            </div>

            <button class="change-photo" onclick="changeProfilePhoto()">
                📷
            </button>
        </div>

        <h2 id="profileName">Basit</h2>

        <p class="profile-phone" id="profileEmail">
            basit@example.com
        </p>

        <p class="profile-meta" id="profileMeta"></p>

        <div class="profile-section">

            <p class="profile-label">Name</p>

            <div class="profile-row">
                <span>👤</span>
                <strong id="displayName">Basit</strong>

                <button onclick="editProfileName()">
                    ✏️
                </button>
            </div>

        </div>


        <div class="profile-section">

            <p class="profile-label">About</p>

            <div class="profile-row">

                <span>💬</span>

                <strong id="profileAbout">
                    Available
                </strong>

                <button onclick="editAbout()">
                    ✏️
                </button>

            </div>

        </div>


        <div class="profile-section">

            <p class="profile-label">Phone</p>

            <div class="profile-row">

                <span>📞</span>

                <strong id="profilePhone">
                    +234 800 000 0000
                </strong>

            </div>

        </div>

    </main>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
